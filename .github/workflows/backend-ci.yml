name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'be/**'
      - 'render.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'be/**'
      - 'render.yaml'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: be/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
